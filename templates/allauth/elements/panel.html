{% load allauth %}
<section class="rounded-md border border-border bg-surface p-5 shadow-1 dark:shadow-none flex flex-col gap-3">
  <h2 class="font-display text-xl text-text">
    {% slot title %}
  {% endslot %}
</h2>
{% slot body %}
{% endslot %}
{% if slots.actions %}
  <div class="flex flex-wrap gap-2">
    {% for action in slots.actions %}{{ action }}{% endfor %}
  </div>
{% endif %}
</section>
