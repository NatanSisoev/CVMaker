{% load allauth %}
<details class="rounded-sm border border-border px-3 py-2"
         {% if attrs.open %}open{% endif %}>
  <summary class="cursor-pointer text-sm font-medium text-text">
    {% slot summary %}
  {% endslot %}
</summary>
<div class="mt-2">
  {% slot body %}
{% endslot %}
</div>
</details>
