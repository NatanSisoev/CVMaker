{% extends 'base.html' %}
{% block title %}Status{% endblock %}
{% block content %}
  <section class="mx-auto max-w-xl px-4 py-16">
    <h1 class="font-display text-3xl text-text mb-6">Status</h1>
    <ul class="flex flex-col gap-3">
      {% for check in checks %}
        <li class="flex items-center justify-between rounded-md border border-border bg-surface p-4">
          <span class="text-text">{{ check.name }}</span>
          <span class="text-sm {% if check.ok %}text-text{% else %}text-danger{% endif %}">
            {% if check.ok %}
              Operational
            {% else %}
              Unavailable
            {% endif %}
          </span>
        </li>
      {% endfor %}
    </ul>
  </section>
{% endblock %}
