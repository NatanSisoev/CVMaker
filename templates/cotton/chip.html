{# Chip -- a removable / clickable tag.

   Props:
     dismissible   "true" renders an × button (no behavior wired -- caller
                   attaches an hx-... or x-on:click)
   Slot: chip label.
#}
<c-vars dismissible="" />
<span class="inline-flex items-center gap-1 rounded-full border border-border bg-surface-2 px-3 py-1 text-sm text-text {{ attrs.class|default:'' }}"
      {{ attrs }}>
  {{ slot }}
  {% if dismissible %}
    <button type="button"
            class="ml-1 text-text-muted hover:text-text"
            aria-label="Remove">×</button>
  {% endif %}
</span>
