{# Textarea.

   Props: name, label, hint, error, value, required, rows (default 4), id.
#}
<c-vars rows="4" required="" />

<div class="flex flex-col gap-2">
  {% if label %}
    <label for="{{ id|default:name }}" class="text-sm font-medium text-text">
      {{ label }}{% if required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}
    </label>
  {% endif %}
  <textarea name="{{ name }}"
            id="{{ id|default:name }}"
            rows="{{ rows }}"
            {% if required %}required{% endif %}
            class="form-textarea rounded-sm border border-border bg-surface-2 px-3 py-2 text-base text-text placeholder:text-text-muted focus:border-accent focus:outline-none focus:shadow-focus {% if error %}border-danger focus:border-danger{% endif %} {{ attrs.class|default:'' }}"
            {{ attrs }}>{{ value|default:'' }}</textarea>
  {% if error %}
    <p class="text-xs text-danger">{{ error }}</p>
  {% elif hint %}
    <p class="text-xs text-text-muted">{{ hint }}</p>
  {% endif %}
</div>
