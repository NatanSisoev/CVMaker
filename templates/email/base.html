<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CVMaker</title>
  </head>
  {# Email clients ignore <style> and classes: inline styles, table layout. #}
  <body style="margin:0;
               padding:0;
               background:#FAFAF7;
               font-family:Inter,Segoe UI,Helvetica,Arial,sans-serif;
               color:#1C1B19">
    <table role="presentation"
           width="100%"
           cellpadding="0"
           cellspacing="0"
           style="background:#FAFAF7;
                  padding:32px 12px">
      <tr>
        <td align="center">
          <table role="presentation"
                 width="560"
                 cellpadding="0"
                 cellspacing="0"
                 style="max-width:560px;
                        width:100%;
                        background:#FFFFFF;
                        border:1px solid #E7E5E0;
                        border-radius:8px">
            <tr>
              <td style="padding:24px 32px 0 32px;
                         font-family:Georgia,'Times New Roman',serif;
                         font-size:22px;
                         color:#1C1B19">CVMaker</td>
            </tr>
            <tr>
              <td style="padding:16px 32px 32px 32px;font-size:15px;line-height:1.6;">
                {% block content %}
                {% endblock content %}
              </td>
            </tr>
          </table>
          <p style="font-size:12px;color:#6B6862;margin:16px 0 0 0;">
            You're getting this email because of an action on your CVMaker account.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
