{% extends 'base.html' %}

{% block title %}CV Locale Form{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl px-4 py-12">
  <h1 class="font-display text-3xl text-text mb-6">CV Locale</h1>

  <form method="post" enctype="multipart/form-data" novalidate class="cv-form">
    {% csrf_token %}
    <c-card>
      <c-slot name="header">Locale Details</c-slot>
      {% include 'includes/form_fields.html' %}
    </c-card>
    <div class="mt-6 flex items-center gap-2">
      <c-button type="submit" variant="primary">Save CV Locale</c-button>
      <c-button href="{% url 'cvlocale-list' %}" variant="ghost">Cancel</c-button>
    </div>
  </form>
</section>
{% endblock %}
