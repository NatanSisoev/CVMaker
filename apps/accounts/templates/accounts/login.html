{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<section class="mx-auto max-w-md px-4 py-16">
  <c-card>
    <c-slot name="header">
      <h1 class="font-display text-2xl">Log in</h1>
    </c-slot>

    <form method="post" class="flex flex-col gap-6">
      {% csrf_token %}

      {% if form.non_field_errors %}
        <div class="rounded-md border border-danger bg-danger/10 px-3 py-2 text-sm text-danger">
          {{ form.non_field_errors|join:" " }}
        </div>
      {% endif %}

      <c-input name="{{ form.username.html_name }}"
               label="Email"
               type="email"
               value="{{ form.username.value|default:'' }}"
               error="{{ form.username.errors|join:' ' }}"
               required="true" />

      <c-input name="{{ form.password.html_name }}"
               label="Password"
               type="password"
               error="{{ form.password.errors|join:' ' }}"
               required="true" />

      <c-button type="submit" variant="primary" full="true">Log in</c-button>
    </form>

    <c-slot name="footer">
      <div class="flex items-center justify-between">
        <a href="{% url 'signup' %}" class="hover:text-text">New here? Sign up.</a>
        <a href="{% url 'password_reset' %}" class="hover:text-text">Forgot password?</a>
      </div>
    </c-slot>
  </c-card>
</section>
{% endblock %}
