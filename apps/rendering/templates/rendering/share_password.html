{% extends 'base.html' %}
{% block title %}Protected CV{% endblock %}
{% block content %}
  <section class="mx-auto max-w-sm px-4 py-20">
    <h1 class="font-display text-2xl text-text mb-2">This CV is password protected</h1>
    <p class="mb-6 text-text-muted">Enter the password you were given to open the PDF.</p>
    {% if wrong %}<p class="mb-3 text-sm text-danger" role="alert">That password is not right.</p>{% endif %}
    <form method="post" class="flex flex-col gap-3">
      {% csrf_token %}
      <input type="password" name="password" required autofocus aria-label="Password"
             class="rounded-md border border-border bg-surface-2 px-3 py-2 text-text">
      <c-button type="submit">Open PDF</c-button>
    </form>
  </section>
{% endblock %}
