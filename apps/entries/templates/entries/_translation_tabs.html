{# Language tabs for an entry's translations. Context: entry. #}
{% if entry.TRANSLATABLE_FIELDS %}
<div class="mt-4 border-t border-border pt-3">
  <p class="mb-2 text-sm font-medium text-text">Translations</p>
  <div class="flex flex-wrap items-center gap-2">
    {% for code in entry.translations %}
      <button type="button"
              class="rounded-full border border-border bg-surface px-3 py-1 text-sm font-medium text-text hover:bg-surface-2 focus:outline-none focus-visible:shadow-focus"
              hx-get="{% url 'entry-translate' entry_id=entry.id %}?lang={{ code }}"
              hx-target="#translate-{{ entry.id }}"
              hx-swap="outerHTML">{{ code|upper }}</button>
    {% endfor %}
    <form class="flex items-center gap-1"
          hx-get="{% url 'entry-translate' entry_id=entry.id %}"
          hx-target="#translate-{{ entry.id }}"
          hx-swap="outerHTML">
      <label for="new-lang-{{ entry.id }}" class="sr-only">New language code</label>
      <input id="new-lang-{{ entry.id }}" name="lang" maxlength="2" placeholder="es" required
             class="h-8 w-14 rounded-sm border border-border bg-surface-2 px-2 text-sm text-text focus:border-accent focus:outline-none focus:shadow-focus">
      <c-button type="submit" variant="secondary" size="sm">+ Add</c-button>
    </form>
  </div>
  <div id="translate-{{ entry.id }}"></div>
</div>
{% endif %}
