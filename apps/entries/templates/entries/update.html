{% extends "base.html" %}

{% block title %}Edit {{ entry_type }}{% endblock %}

{% block content %}
<section class="mx-auto max-w-2xl px-4 py-12">
  <h1 class="font-display text-3xl text-text mb-6">Edit {{ entry_type }}</h1>
  <form method="post" novalidate class="cv-form">
    {% csrf_token %}
    <c-card>{% include 'includes/form_fields.html' %}</c-card>
    <div class="mt-6 flex items-center justify-between">
      <c-button href="{% url 'entry-detail' entry_id=entry.id %}" variant="ghost">Cancel</c-button>
      <c-button type="submit" variant="primary">Save Changes</c-button>
    </div>
  </form>
</section>
{% endblock %}
